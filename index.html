<!DOCTYPE html>
<html lang="en" data-theme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6F68">
<title>Calyx — every date and time, in one place</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Figtree:wght@400;500;600;700&family=Anton&family=Archivo:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="stage">
 <div class="phone">
  <div class="app" id="app">
   <div class="status"><span id="sbt">14:30</span><span class="isl"></span><span class="sic">
     <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
     <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>
   <div class="main" id="main">
     <div id="view" role="main"></div>
     <div class="qa" id="qa"><input id="qain" placeholder="Add a task, like “renew passport fri !high”" autocomplete="off" enterkeyhint="done"><button data-act="qaadd" aria-label="Add task"></button></div>
     <nav class="dock" id="dock">
       <div class="tabs" id="tabs" style="--idx:0"><span class="tp"></span></div>
       <button class="fab press" data-act="cmd" aria-label="Open command bar" id="fab"></button>
     </nav>
     <div class="toast" id="toast"><span id="toastmsg"></span><button id="toastact" data-act="toastact">Undo</button></div>
     <div id="overlays"></div>
   </div>
  </div>
 </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
